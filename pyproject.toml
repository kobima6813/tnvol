[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tnvol"
version = "0.10.0"
description = "Error-bounded compressor for 3-D scientific volumes"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Kobi" }]
keywords = ["compression", "scientific-data", "wavelet", "volume", "error-bound"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Archiving :: Compression",
]
dependencies = ["numpy>=1.20"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
tnvol = "tnvol.cli:main"

[project.urls]
# Repository URL to be added once the project is published.

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tnvol = ["*.c", "libwlc*.so", "libwlc*.dylib", "libwlc*.dll", "wlc*.dll"]

[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-*"
skip = "pp* *-musllinux_*"
test-requires = ["pytest", "numpy"]
test-command = "python -m pytest {package}/tests -q"
environment = { PIP_ONLY_BINARY = "numpy" }
# Source install compiles the C codec; wheels already contain the libraries.

[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64"]
# manylinux2014 ships GCC 10.2; current NumPy needs a binary wheel (or GCC >= 10.3).
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]
